# AutoFightBot Configuration
settings:
  aggro-radius: 64.0
  target-creative: false
  target-spectator: false
  bypass-permission: "autofight.bypass"
  default-difficulty: "HARD"
  default-mode: "HUMANIZED" # HUMANIZED or ROBOTIC
  default-kit: "diamond_pvp"

difficulties:
  EASY:
    reaction-delay-ticks: 8
    crit-chance: 0.35
    w-tap-chance: 0.40
    shield-block-chance: 0.50
    aim-smoothing-deg-per-tick: 15.0
    attack-charge-threshold: 0.85
  MEDIUM:
    reaction-delay-ticks: 5
    crit-chance: 0.65
    w-tap-chance: 0.70
    shield-block-chance: 0.75
    aim-smoothing-deg-per-tick: 25.0
    attack-charge-threshold: 0.92
  HARD:
    reaction-delay-ticks: 3
    crit-chance: 0.85
    w-tap-chance: 0.90
    shield-block-chance: 0.90
    aim-smoothing-deg-per-tick: 40.0
    attack-charge-threshold: 0.98
  NIGHTMARE:
    reaction-delay-ticks: 0
    crit-chance: 1.00
    w-tap-chance: 1.00
    shield-block-chance: 1.00
    aim-smoothing-deg-per-tick: 180.0
    attack-charge-threshold: 1.00

